# Rights profiles used by the TEKSI Wastewater hook workflow.
#
# Paths are resolved relative to this file unless the implementation
# explicitly supports absolute paths.

default:
  description: Default TEKSI Wastewater provider rights profile.
  provider_rights: templates/provider_rights.yaml
  privilege_tree: templates/privilege_tree.yaml

