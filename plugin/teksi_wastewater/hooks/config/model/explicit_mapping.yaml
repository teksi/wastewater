models:
  agxx:
    defaults:
      target_attribute: obj_id
      source_attribute: t_ili_tid
      identities:
        agxx_last_modification:
          target_attribute: fk_element
      attributes:
        letzte_aenderung_wi:
          target:
            class: agxx_last_modification
            attribute: ag64_last_modification
        letzte_aenderung_gep:
          target:
            class: agxx_last_modification
            attribute: ag96_last_modification

    classes:
      GepKnoten:
        function:
          schema: tww_app
          name: fct_agxx_gepknoten_mapping_jsonb
          parameters:
            row: $row

      GepHaltung:
        function:
          schema: tww_app
          name: fct_agxx_gephaltung_mapping_jsonb
          parameters:
            row: $row

      GepMassnahme:
        identities:
          measure:
        attributes:
          kategorie:
            target:
              class: measure
              attribute: category
              value_list: tww_vl.measure_category_import_rel_agxx
              mapping_attribute: value_de
          prioritaetag:
            target:
              class: measure
              attribute: priority
              value_list: tww_vl.measure_category_priority
              mapping_attribute: value_de

      Einzugsgebiet:
        identities:
          catchment_area:
        attributes:
          entwaesserungssystemag_geplant:
            target:
              class: catchment_area
              attribute: drainage_system_planned
              value_list: tww_vl.catchment_area_drainage_system_planned_import_rel_agxx
              mapping_attribute: value_de
          entwaesserungssystemag_ist:
            target:
              class: catchment_area
              attribute: drainage_system_current
              value_list: tww_vl.catchment_area_drainage_system_current_import_rel_agxx
              mapping_attribute: value_de
        relations:
          datenbewirtschafter_gep:
            target:
              class: catchment_area
              attribute: fk_provider

      Ueberlauf_Foerderaggregat:
        function:
          schema: tww_app
          name: fct_agxx_ueberlauf_foerderaggregat_mapping_jsonb
          parameters:
            row: $row

      BautenAusserhalbBaugebiet:
        identities:
          agxx_building_group:
            target_attribute: fk_building_group
          building_group:
        attributes:
          anzstaendigeeinwohner:
            target:
              class: agxx_building_group
              attribute: ag96_population
          eigentuemername:
            target:
              class: agxx_building_group
              attribute: ag96_owner_name
          eigentuemeradresse:
            target:
              class: agxx_building_group
              attribute: ag96_owner_address
          arealnutzung:
            target:
              class: building_group
              attribute: function
              value_list: tww_vl.building_group_function_import_rel_agxx
              mapping_attribute: value_de
          beseitigung_haeusliches_abwasser:
            target:
              class: agxx_building_group
              attribute: ag96_disposal_wastewater
              value_list: tww_vl.building_group_ag96_disposal_type
              mapping_attribute: value_de
          beseitigung_gewerbliches_abwasser:
            target:
              class: agxx_building_group
              attribute: ag96_disposal_industrial_wastewater
              value_list: tww_vl.building_group_ag96_disposal_type
              mapping_attribute: value_de
          beseitigung_platzentwaesserung:
            target:
              class: agxx_building_group
              attribute: ag96_disposal_square_water
              value_list: tww_vl.building_group_ag96_disposal_type
              mapping_attribute: value_de
          beseitigung_dachentwaesserung:
            target:
              class: agxx_building_group
              attribute: ag96_disposal_roof_water
              value_list: tww_vl.building_group_ag96_disposal_type
              mapping_attribute: value_de
        relations:
          datenbewirtschafter_gep:
            target:
              class: building_group
              attribute: fk_provider

      SBWEinzugsgebiet:
        identities:
          agxx_catchment_area_totals:
            target_attribute: fk_catchment_area_totals
        attributes:
          fremdwasseranfall_geplant:
            target:
              class: agxx_catchment_area_totals
              attribute: ag96_sewer_infiltration_water_dim
          schmutzabwasseranfall_geplant:
            target:
              class: agxx_catchment_area_totals
              attribute: ag96_waste_water_production_dim
          perimeter_ist:
            target:
              class: agxx_catchment_area_totals
              attribute: ag96_perimeter_geometry
        relations:
          datenbewirtschafter_gep:
            target:
              class: catchment_area_totals
              attribute: fk_provider

      VersickerungsbereichAG:
        identities:
          agxx_infiltration_zone:
            target_attribute: fk_infiltration_zone
          infiltration_zone:
        attributes:
          durchlaessigkeit:
            target:
              class: agxx_infiltration_zone
              attribute: ag96_permeability
          einschraenkung:
            target:
              class: agxx_infiltration_zone
              attribute: ag96_limitation
          maechtigkeit:
            target:
              class: agxx_infiltration_zone
              attribute: ag96_thickness
          q_check:
            target:
              class: agxx_infiltration_zone
              attribute: ag96_q_check
          versickerungsmoeglichkeitag:
            target:
              class: infiltration_zone
              attribute: infiltration_capacity
              value_list: tww_vl.infiltration_zone_infiltration_capacity
              mapping_attribute: value_de
        relations:
          datenbewirtschafter_gep:
            target:
              class: infiltration_zone
              attribute: fk_provider

  sia405_abwasser:
    defaults:
      relations:
        fk_provider:
          target:
            class: organisation
          localisations:
              de: DatenbewirtschafterRef
              fr: fournisseur_des_donneesref
        fk_dataowner:
          target:
            class: organisation
          localisations:
              de: DatenherrRef
              fr: maitre_des_donneesref
        fk_owner:
          target:
            class: organisation
          localisations:
              de: EigentuemerRef
              fr: proprietaireref
        fk_operator:
          target:
            class: organisation
          localisations:
              de: BetreiberRef
              fr: exploitantref
    classes:
      reach:
        relations:
          fk_reach_point_from:
            target:
              class: reach_point
            localisations:
                de: vonhaltungspunktref
                fr: point_troncon_deref
          fk_reach_point_to:
            target:
              class: reach_point
            localisations:
                de: nachhaltungspunktref
                fr: point_troncon_versref

  dss:
    defaults:
      inherit_from: sia405_abwasser
    classes:
      catchment_area:
        relations:
          fk_wastewater_networkelement_rw_current:
            target:
              class: wastewater_networkelement
            localisations:
                de: abwassernetzelement_rw_istref
                fr: element_reseau_as_ep_actuelref
          fk_wastewater_networkelement_ww_current:
            target:
              class: wastewater_networkelement
            localisations:
                de: abwassernetzelement_sw_istref
                fr: element_reseau_as_eu_actuelref
          fk_wastewater_networkelement_rw_planned:
            target:
              class: wastewater_networkelement
            localisations:
                de: abwassernetzelement_rw_geplantref
                fr: element_reseau_as_ep_prevuref
          fk_wastewater_networkelement_ww_planned:
            target:
              class: wastewater_networkelement
            localisations:
                de: abwassernetzelement_sw_geplantref
                fr: element_reseau_as_eu_prevuref
          fk_special_building_rw_current:
            target:
              class: log_card
            localisations:
                de: sbw_rw_istref
                fr: ouvrage_special_ep_actuelref
          fk_special_building_ww_current:
            target:
              class: log_card
            localisations:
                de: sbw_sw_istref
                fr: ouvrage_special_eu_actuelref
          fk_special_building_rw_planned:
            target:
              class: log_card
            localisations:
                de: sbw_rw_geplantref
                fr: ouvrage_special_ep_prevuref
          fk_special_building_ww_planned:
            target:
              class: log_card
            localisations:
                de: sbw_sw_geplantref
                fr: ouvrage_special_eu_prevuref
      hydraulic_char_data:
        relations:
          fk_wastewater_node:
            target:
              class: wastewater_node
            localisations:
                de: abwasserknotenref
                fr: noeud_reseauref
          fk_primary_direction:
            target:
              class: wastewater_node
            localisations:
                de: primaerrichtungref
                fr: direction_principaleref
      log_card:
        relations:
          fk_next_special_building:
            target:
              class: log_card
            localisations:
                de: naechstes_sbwref
                fr: ouvrage_special_suivantref
          fk_main_structure:
            target:
              class: wastewater_networkelement
            localisations:
                de: hauptbauwerkref
                fr: ouvrage_principalref
          fk_agency:
            target:
              class: organisation
            localisations:
                de: bueroref
                fr: bureauref
          fk_location_municipality:
            target:
              class: organisation
            localisations:
                de: standortgemeinderef
                fr: commune_implantationref
      measure:
        relations:
          fk_responsible_entity:
            target:
              class: organisation
            localisations:
                de: traegerschaftref
                fr: entite_responsableref
          fk_responsible_start:
            target:
              class: organisation
            localisations:
                de: verantwortlich_ausloesungref
                fr: responsable_declenchementref
      overflow:
        relations:
          fk_wastewater_node:
            target:
              class: wastewater_node
            localisations:
                de: abwasserknotenref
                fr: noeud_reseauref
          fk_overflow_to:
            target:
              class: wastewater_node
            localisations:
                de: ueberlaufnachref
                fr: deversement_versref

  vsa_kek:
    defaults:
      inherit_from: sia405_abwasser
