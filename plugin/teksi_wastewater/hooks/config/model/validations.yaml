defaults:
  mandatory:
      - obj_id
      - identifier
      - fk_provider
      - fk_dataowner
  validation_rules:
    last_modification:
      rules:
        - id: newer_than_existing
          level: info
    fk_provider:
      rules:
        - id: equals_context_value
          context_value: provider_oid
          level: error
          operations:
            - insert
    fk_dataowner:
      rules:
        - id: equals_context_value
          context_value: dataowner_oid
          level: error
          operations:
            - insert
  object_validation_rules:
    unique_identifier_combo:
      rules:
        - id: is_unique
          parameters:
            attributes:
              - identifier
              - fk_dataowner
          level: error



