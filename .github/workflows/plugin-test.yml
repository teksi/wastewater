name: 🔌 Plugin | Tests

on:
  push:
    branches: [main]
    paths:
      - "datamodel/**"
      - "plugin/**"
      - ".github/workflows/plugin-test.yml"
      - ".github/scripts/wait-for-final-postgres.sh"
  pull_request:
    branches: [main]
    paths:
      - "datamodel/**"
      - "plugin/**"
      - ".github/workflows/plugin-test.yml"
      - ".github/scripts/wait-for-final-postgres.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    name: Run QGIS plugin tests | ${{ matrix.qgis_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        qgis_version: [stable-noble, latest]
    env:
      PGSERVICE: pg_tww
      DB_NAME: tww
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
      COMPOSE_PROFILES: qgis
      COMPOSE_PROJECT_NAME: plugin-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.qgis_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup env
        run: cp .env.example .env
      - name: Download INTERLIS libraries
        run: sudo ./plugin/scripts/download-interlis-libs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build QGIS image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./plugin/.docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: teksi-wastewater-qgis:${{ env.QGIS_TEST_VERSION }}
          build-args: |
            QGIS_TEST_VERSION=${{ env.QGIS_TEST_VERSION }}
          cache-from: type=gha,scope=teksi-wastewater-qgis-${{ env.QGIS_TEST_VERSION }}
          cache-to: type=gha,scope=teksi-wastewater-qgis-${{ env.QGIS_TEST_VERSION }},mode=max
      - name: Start isolated Docker stack
        run: docker compose up --no-build -d
      - name: Wait for final PostgreSQL server
        run: ./.github/scripts/wait-for-final-postgres.sh db 180
      - name: Initialize database
        run: |
          set -euo pipefail
          docker compose exec -T db dropdb -h localhost -U postgres --if-exists "${DB_NAME}"
          docker compose exec -T db createdb -h localhost -U postgres "${DB_NAME}"
          docker compose run --rm pum -p "${PGSERVICE}" -d datamodel install -p SRID 2056
      - name: Install hook dependencies in QGIS container
        run: |
          docker compose exec -T qgis sh -c '
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends git python3-venv
            rm -rf /var/lib/apt/lists/*
            rm -rf /tmp/teksi-hooks-venv
            python3 -m venv --system-site-packages /tmp/teksi-hooks-venv
            . /tmp/teksi-hooks-venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install -e "/usr/src[dev]"
            python -m pip check
          '
      - name: Run QGIS tests except DSS
        run: |
          docker compose exec -T qgis sh -c '
            set -eu
            . /tmp/teksi-hooks-venv/bin/activate
            export PYTHONPATH="/usr/src/plugin:/usr/src:/usr/share/qgis/python"
            xvfb-run -a python -m pytest /usr/src/plugin/tests/dockerised/qgis/test_interlis.py -k "not test_dss_dataset_import_export" -v -c /usr/src/plugin/pytest.ini
          '
      - name: Reset database for DSS test
        run: |
          set -euo pipefail
          docker compose exec -T db dropdb -h localhost -U postgres --if-exists "${DB_NAME}"
          docker compose exec -T db createdb -h localhost -U postgres "${DB_NAME}"
          docker compose run --rm pum -p "${PGSERVICE}" -d datamodel install -p SRID 2056
      - name: Run QGIS DSS test
        run: |
          docker compose exec -T qgis sh -c '
            set -eu
            . /tmp/teksi-hooks-venv/bin/activate
            export PYTHONPATH="/usr/src/plugin:/usr/src:/usr/share/qgis/python"
            xvfb-run -a python -m pytest "/usr/src/plugin/tests/dockerised/qgis/test_interlis.py::TestInterlis::test_dss_dataset_import_export" -v -c /usr/src/plugin/pytest.ini
          '
      - name: Show Docker service status
        if: failure()
        run: docker compose ps --all
      - name: Show Docker logs
        if: failure()
        run: docker compose logs --no-color --tail=500 db qgis
      - name: Stop isolated services
        if: always()
        run: docker compose down --volumes --remove-orphans

  plugin-tests-no-qgis:
    name: Run CLI tests without QGIS on runner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_NAME: tww
      PGSERVICE: pg_tww
      COMPOSE_PROFILES: qgis
      COMPOSE_PROJECT_NAME: cli-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup env
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download INTERLIS libraries
        run: sudo ./plugin/scripts/download-interlis-libs.sh
      - name: Start isolated services
        run: docker compose up db qgis -d
      - name: Wait for final PostgreSQL server
        run: ./.github/scripts/wait-for-final-postgres.sh db 180
      - name: Initialize database
        run: |
          set -euo pipefail
          docker compose exec -T db dropdb -h localhost -U postgres --if-exists "${DB_NAME}"
          docker compose exec -T db createdb -h localhost -U postgres "${DB_NAME}"
          docker compose run --rm pum -p "${PGSERVICE}" -d datamodel install -p SRID 2056
      - name: Install hook dependencies in QGIS container
        run: |
          docker compose exec -T qgis sh -c '
            set -eu
            rm -rf /tmp/teksi-hooks-venv
            python3 -m venv --system-site-packages /tmp/teksi-hooks-venv
            . /tmp/teksi-hooks-venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install -e "/usr/src[dev]"
            python -m pip check
          '
      - name: Run pytest without QGIS on runner
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/plugin:
            ${{ github.workspace }}
        run: python -m pytest plugin/tests/dockerised/no_qgis -v -c plugin/pytest.ini -m no_qgis
      - name: Show Docker service status
        if: failure()
        run: docker compose ps --all
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color --tail=500 db qgis
      - name: Stop isolated services
        if: always()
        run: docker compose down --volumes --remove-orphans
