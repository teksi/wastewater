name: Plugin Adapter Tests

on:
  push:
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/**"
      - "pyproject.toml"
      - "plugin/scripts/download-interlis-libs.sh"
      - "docker-compose.yml"
      - ".github/workflows/plugin-adapter-tests.yml"
      - ".github/actions/start_qgis_docker/action.yml"

  pull_request:
    branches:
      - main
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/**"
      - "pyproject.toml"
      - "plugin/scripts/download-interlis-libs.sh"
      - "docker-compose.yml"
      - ".github/workflows/plugin-adapter-tests.yml"
      - ".github/actions/start_qgis_docker/action.yml"

jobs:
  unit-tests:
    name: Adapter unit tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run adapter unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin:${{ github.workspace }}/plugin_hooks:${{ github.workspace }}
        run: |
          pytest -v plugin/tests/unit_tests

  integration-tests-db-qgis:
    name: Adapter integration tests with DB/QGIS
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        qgis_version:
          - stable-noble
          - latest

    env:
      PGSERVICE: pg_tww
      DB_NAME: tww
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
      COMPOSE_PROFILES: qgis
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup env
        run: cp .env.example .env

      - name: Start qgis docker compose stack
        uses: ./.github/actions/start_qgis_docker
        with:
          qgis-test-version: ${{ env.QGIS_TEST_VERSION }}

      - name: Install hook dependencies in qgis container
        run: |
          docker compose exec qgis sh -c '
            apt-get update
            apt-get install -y python3-venv git
            python3 -m venv --system-site-packages /tmp/teksi-hooks-venv
            . /tmp/teksi-hooks-venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e "/usr/src[dev]"
          '

      - name: Initialize database
        run: |
          docker compose exec db sh -c "dropdb -U postgres --if-exists ${DB_NAME}"
          docker compose exec db sh -c "createdb -U postgres ${DB_NAME}"
          docker compose run pum -p ${PGSERVICE} -d datamodel install -p SRID 2056 -p modification_agxx true

      - name: Debug dependency import in qgis container
        run: |
          docker compose exec qgis sh -c '
            . /tmp/teksi-hooks-venv/bin/activate

            echo "Python executable:"
            which python
            python --version

            echo "Pip:"
            which pip
            pip --version

            echo "Package info teksi-hooks:"
            pip show teksi-hooks || true

            echo "Package info pgserviceparser:"
            pip show teksi-pgserviceparser || true
            '

      - name: Run dockerised adapter tests
        run: |
          docker compose exec qgis sh -c '
            . /tmp/teksi-hooks-venv/bin/activate
            PYTHONPATH=/usr/src/plugin:/usr/src/plugin_hooks:/usr/src:/usr/share/qgis/python \
            xvfb-run python -m pytest \
              /usr/src/plugin/tests/dockerised/hooks \
              -v -c /usr/src/plugin/pytest.ini -m no_qgis
          '

      - name: docker logs
        if: failure()
        run: docker compose logs db qgis

      - name: Stop services
        if: always()
        run: docker compose down -v