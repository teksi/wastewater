name: Plugin Adapter Tests

on:
  push:
    branches:
      - main
    paths:
      - "plugin/teksi_wastewater/**"
      - "plugin/tests/**"
      - "pyproject.toml"
      - "plugin/scripts/download-interlis-libs.sh"
      - "docker-compose.yml"
      - ".github/workflows/plugin-adapter-tests.yml"
      - ".github/actions/start_qgis_docker/**"

  pull_request:
    branches:
      - main
    paths:
      - "plugin/teksi_wastewater/hooks/**"
      - "plugin/teksi_wastewater/interlis/**"
      - "plugin/tests/**"
      - "pyproject.toml"
      - "plugin/scripts/download-interlis-libs.sh"
      - "docker-compose.yml"
      - ".github/workflows/plugin-adapter-tests.yml"
      - ".github/actions/start_qgis_docker/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Adapter unit tests | Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run adapter unit tests
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/plugin:
            ${{ github.workspace }}/plugin_hooks:
            ${{ github.workspace }}
        run: |
          python -m pytest \
            plugin/tests/unit_tests \
            -v \
            --color=yes

  integration-tests-db-qgis:
    name: DB/QGIS integration | ${{ matrix.qgis_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        qgis_version:
          - stable-noble
          # - latest

    env:
      PGSERVICE: pg_tww
      DB_NAME: tww
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
      COMPOSE_PROFILES: qgis

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up environment
        run: cp .env.example .env

      - name: Download INTERLIS libraries
        run: ./plugin/scripts/download-interlis-libs.sh

      - name: Start QGIS Docker Compose stack
        uses: ./.github/actions/start_qgis_docker
        with:
          qgis-test-version: ${{ env.QGIS_TEST_VERSION }}

      - name: Wait for PostgreSQL
        run: |
          timeout 120 sh -c '
            until docker compose exec -T db \
              pg_isready \
              -U postgres \
              -d postgres
            do
              sleep 2
            done
          '

      - name: Install hook dependencies in QGIS container
        run: |
          docker compose exec -T qgis sh -c '
            set -eu

            apt-get update

            apt-get install -y \
              --no-install-recommends \
              git \
              python3-venv

            rm -rf /var/lib/apt/lists/*

            if [ ! -d /tmp/teksi-hooks-venv ]; then
              python3 -m venv \
                --system-site-packages \
                /tmp/teksi-hooks-venv
            fi

            . /tmp/teksi-hooks-venv/bin/activate

            python -m pip install --upgrade pip
            python -m pip install -e "/usr/src[dev]"
          '

      - name: Initialize database
        run: |
          docker compose exec -T db sh -c \
            "dropdb -U postgres --if-exists '${DB_NAME}'"

          docker compose exec -T db sh -c \
            "createdb -U postgres '${DB_NAME}'"

          docker compose run --rm pum \
            -p "${PGSERVICE}" \
            -d datamodel \
            install \
            -p SRID 2056 \
            -p modification_agxx true

      - name: Verify dependency imports
        run: |
          docker compose exec -T qgis sh -c '
            set -eu

            . /tmp/teksi-hooks-venv/bin/activate

            export PYTHONPATH="/usr/src/plugin:/usr/src/plugin_hooks:/usr/src:/usr/share/qgis/python"

            echo "Python executable:"
            command -v python
            python --version

            echo "Pip:"
            command -v pip
            pip --version

            echo "Package info teksi-hooks:"
            pip show teksi-hooks

            echo "Package info pgserviceparser:"
            pip show pgserviceparser

            echo "Imported TEKSI Wastewater package:"
            python -c "import teksi_wastewater; print(teksi_wastewater.__file__)"

            echo "Imported teksi-hooks package:"
            python -c "import teksi_hooks; print(teksi_hooks.__file__)"
          '

      - name: Run Dockerized adapter tests
        run: |
          docker compose exec -T qgis sh -c '
            set -eu

            . /tmp/teksi-hooks-venv/bin/activate

            export PYTHONPATH="/usr/src/plugin:/usr/src/plugin_hooks:/usr/src:/usr/share/qgis/python"

            xvfb-run -a python -m pytest \
              /usr/src/plugin/tests/dockerised/hooks \
              -v \
              --color=yes \
              -c /usr/src/plugin/pytest.ini \
              -m no_qgis
          '

      - name: Show Docker service status
        if: failure()
        run: docker compose ps --all

      - name: Show Docker logs
        if: failure()
        run: |
          docker compose logs \
            --no-color \
            --tail=500 \
            db \
            qgis

      - name: Stop services
        if: always()
        run: |
          docker compose down \
            --volumes \
            --remove-orphans
