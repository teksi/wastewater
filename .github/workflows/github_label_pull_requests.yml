name: 🔩 GitHub - Label pull requests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  label-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels based on modified files
        uses: actions/github-script@v7
        with:
          script: |
            const rules = [
              { path: "plugin/", label: "plugin" },
              { path: "project/", label: "QGIS project" },
              { path: "datamodel/", label: "datamodel" }
            ];

            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              }
            );

            const existingLabels =
              context.payload.pull_request.labels.map(
                label => label.name
              );

            const labelsToAdd = rules
              .filter(rule =>
                files.some(file =>
                  file.filename.startsWith(rule.path)
                )
              )
              .map(rule => rule.label)
              .filter(label =>
                !existingLabels.includes(label)
              );

            if (labelsToAdd.length > 0) {
              console.log(
                `Adding labels: ${labelsToAdd.join(", ")}`
              );

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToAdd
              });
            } else {
              console.log("No labels to add");
            }
