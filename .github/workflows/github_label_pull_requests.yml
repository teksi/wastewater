                  per_page: 100
                }
              );

              const touchesProject = files.some(
                file => file.filename.startsWith("project/")
              );

              const labels = pr.labels.map(l => l.name);

              if (touchesProject && !labels.includes(labelName)) {
                console.log(`Adding label to PR #${pr.number}`);

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [labelName]
                });
              }

      - name: Label PRs touching datamodel/
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = "datamodel";

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
